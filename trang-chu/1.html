<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phim - Trang 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="1">
<div class="app">
<aside id="side">
  <div class="brandrow"><div class="brand">Bộ lọc</div><button id="close" aria-label="Tắt menu" title="Tắt menu">✕</button></div>
  <button class="clear" id="clear" hidden>Bỏ hết bộ lọc</button>
  <div class="grp shut"><h3><button class="gt" aria-expanded="false"><span>Loại phim</span><b>▾</b></button></h3><div id="g-type"></div></div>
  <div class="grp shut"><h3><button class="gt" aria-expanded="false"><span>Thể loại</span><b>▾</b></button></h3><div class="list" id="g-genre"></div></div>
  <div class="grp shut"><h3><button class="gt" aria-expanded="false"><span>Quốc gia</span><b>▾</b></button></h3><div class="list" id="g-country"></div></div>
  <div class="grp shut"><h3><button class="gt" aria-expanded="false"><span>Năm phim</span><b>▾</b></button></h3><div class="list" id="g-year"></div></div>
</aside>
<main>
  <div class="top">
    <button id="menu">☰</button>
    <input type="search" id="q" placeholder="Tìm phim theo tên, quốc gia, thể loại, ghi chú…">
  </div>
  <p class="info" id="info"></p>
  <div class="grid" id="grid"></div>
  <nav class="pager" id="pager" aria-label="Phân trang"></nav>
</main>
</div>

<script src="../assets/data.js"></script>
<script src="../assets/app.js"></script>
</body>
</html>
